<main class="bday-card">
    <div class="card-header">
        <h1 class="card-title">HAPPY BIRTHDAY!</h1>
        <p class="card-subtitle">Σ' αγαπάω! </p>
    </div>
    
    <div class="cake-area">
        <div class="candles-container">
            <div class="candle" id="candle-1">
                <div class="flame"></div>
                <div class="wick"></div>
                <div class="stick"></div>
            </div>
            <div class="candle" id="candle-2">
                <div class="flame"></div>
                <div class="wick"></div>
                <div class="stick"></div>
            </div>
            <div class="candle" id="candle-3">
                <div class="flame"></div>
                <div class="wick"></div>
                <div class="stick"></div>
            </div>
        </div>

        <div class="cake">
            <div class="frosting"></div>
            <div class="cake-body">HAPPY 31ST</div>
        </div>
    </div>

    <div class="interaction-zone">
        <p id="instruction-text" class="instruction">ΕΥΧΗΗΗΗΗ!!!</p>
        <button id="mic-btn" class="mic-btn">Πάτα με και φύσα!</button>
    </div>
    <!-- This message starts hidden and unlocks when candles go out -->
    <div class="card-message" id="card-message">
        <h3 class="message-title">ΦΥΣΗΞΕΣ!!!
        </h3>
        <p class="message-text">
            ΧΡΟΝΙΑ ΠΟΛΛΑΑΑΑΑΑΑΑΑΑΑΑΑΑΑΑΑΑΑ
        </p>
        <p class="signature">— Μαράκι Μαρνεζάκι <3</p>
    </div>
</main>
